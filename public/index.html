<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — IoT Dashboard</title>
  <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <img src="/assets/logo.png" alt="Logo" onerror="this.style.display='none'">
      <span>Wiper Motor Test Rig</span>
    </div>
    <div class="sidebar-user">
      Logged in as <strong id="sb-username"></strong>
    </div>
    <nav class="sb-nav">
      <a href="index.html" data-page="index.html"><span class="icon">⊞</span> Overview</a>
      <a href="live.html"  data-page="live.html" ><span class="icon">◉</span> Live Status</a>
      <a href="config.html" data-page="config.html"><span class="icon">⚙</span> Test Config</a>
    </nav>
    <div class="sidebar-footer">
      <a href="#" id="logout-btn">Sign Out</a>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <h1>Station Overview</h1>
      <span class="user-count">
        Users online: <strong id="no-users">—</strong>
      </span>
    </div>

    <div class="content">
      <div class="card">
        <div class="card-title">All Stations — Live</div>
        <table class="overview-table">
          <thead>
            <tr>
              <th>Station</th>
              <th>Status</th>
              <th>Speed</th>
              <th>Torque</th>
              <th>Voltage</th>
              <th>Current</th>
              <th>Cycles Left</th>
              <th>Run Status</th>
            </tr>
          </thead>
          <tbody id="overview-tbody">
            <tr><td colspan="8" style="text-align:center;color:var(--color-text-muted);padding:24px;">Connecting to LabVIEW…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { requireAuth, encodeToken, initSidebar, applyStatusClass, escHtml } from '/js/ui.js';

  const token = requireAuth();
  if (!token) throw new Error('not authenticated');

  initSidebar();

  document.getElementById('logout-btn').addEventListener('click', (e) => {
    e.preventDefault();
    sessionStorage.clear();
    window.location.href = '/login.html';
  });

  const tbody   = document.getElementById('overview-tbody');
  const noUsers = document.getElementById('no-users');

  function renderRows(data) {
    const count = (data.status || []).length;
    if (!count) return;
    tbody.innerHTML = '';
    for (let i = 0; i < count; i++) {
      const id = i + 1;
      const status = data.status?.[i] || 'IDLE';
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><strong>Station ${id}</strong>
            <br><small style="color:var(--color-text-muted)">${escHtml(data.model_no?.[i] || '')}</small></td>
        <td><span class="status-badge" id="sts${id}">${escHtml(status)}</span></td>
        <td>${data.speed?.[i] ?? '—'} rpm</td>
        <td>${data.torque?.[i] ?? '—'} Nm</td>
        <td>${data.voltage?.[i] ?? '—'} V</td>
        <td>${data.current?.[i] ?? '—'} A</td>
        <td>${data.no_cycle?.[i] ?? '—'}</td>
        <td>${escHtml(data.run_sts?.[i] || '—')}</td>`;
      tbody.appendChild(tr);
      applyStatusClass(document.getElementById('sts' + id), status);
    }
    if (noUsers && data['key_5'] != null) noUsers.textContent = data['key_5'];
  }

  async function poll() {
    try {
      const res = await fetch(`/dashboard/update?live=1&token=${encodeToken(token)}`);
      if (res.status === 401 || res.status === 403) {
        sessionStorage.clear();
        window.location.href = '/login.html';
        return;
      }
      renderRows(await res.json());
    } catch (err) {
      console.warn('[overview] poll failed:', err.message);
    }
  }

  poll();
  setInterval(poll, 500);
</script>
</body>
</html>
